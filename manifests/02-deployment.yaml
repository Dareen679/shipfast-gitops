apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipfast-status-api
  namespace: shipfast
  labels:
    app.kubernetes.io/name: shipfast-status-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: shipfast
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: shipfast-status-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipfast-status-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: shipfast
        app.kubernetes.io/version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: status-api
          # Docker Hub image (bump the tag for each new release)
          image: docker.io/dareenzere/shipfast-status-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: shipfast-status-api-config
                  key: APP_ENV
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # gunicorn needs a writable temp dir because the root filesystem is read-only
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
