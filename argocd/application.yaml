apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shipfast-status-api
  namespace: argocd          # Argo CD Applications live in the argocd namespace
  labels:
    app.kubernetes.io/part-of: shipfast
spec:
  project: default
  source:
    repoURL: https://github.com/Dareen679/shipfast-gitops.git
    targetRevision: main
    path: manifests          # Argo CD only watches this folder
  destination:
    server: https://kubernetes.default.svc
    namespace: shipfast
  syncPolicy:
    automated:
      prune: true            # delete cluster resources removed from Git
      selfHeal: true         # undo manual changes made directly in the cluster
    syncOptions:
      - CreateNamespace=true
